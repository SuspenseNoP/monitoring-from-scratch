services:
  prometheus:
    image: prom/prometheus:latest
    ports: 
      - 9090:9090
    volumes: 
      - ./prometheus.yml:/etc/prometheus/prometheus.yml

  node_exporter:
    image: prom/node-exporter:latest
    ports:
      - 9100:9100

  python_app:
    build:
      context: /exporter
      dockerfile: Dockerfile
    ports: 
      - 8000:8000
  
  grafana:
    image: grafana/grafana:latest
    ports: 
      - 3000:3000